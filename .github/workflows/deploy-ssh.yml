name: Deploy Angular to Hostinger (SSH)

# Reemplazo del despliegue por FTP, que empezo a fallar con
# "Timeout (control socket)": no llegaba ni a autenticar.
#
# Secretos necesarios en Settings > Secrets and variables > Actions:
#   SSH_PRIVATE_KEY  clave privada SSH en base64, en una sola linea
#                    (generar con: base64 -w0 ~/.ssh/id_deploy)
#   SSH_HOST         host SSH de Hostinger
#   SSH_USER         usuario SSH (u525153682)
#   SSH_PORT         puerto SSH (en hosting compartido suele ser 65002)

on:
  push:
    branches:
      - main

env:
  # Carpeta publica del dominio principal. Ojo: aqui conviven otras
  # aplicaciones (api/, apps/), por eso el rsync de abajo NO usa --delete.
  DEPLOY_PATH: /home/u525153682/domains/techsolutions.management/public_html
  SITE_URL: https://techsolutions.management

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        # npm ci en vez de npm install: respeta package-lock.json al pie de la
        # letra, asi que la compilacion es reproducible y no se cuela una
        # version nueva de una dependencia sin que nadie lo decida.
        run: npm ci

      - name: Compilar
        run: npm run build -- --configuration production

      - name: Comprobar que los secretos existen
        # GitHub sustituye por cadena vacia los secretos que no existen, sin
        # avisar. Sin esta comprobacion el fallo aparece varios pasos despues
        # como un error críptico de ssh-keyscan con host vacio.
        run: |
          faltan=""
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && faltan="$faltan SSH_PRIVATE_KEY"
          [ -z "${{ secrets.SSH_HOST }}" ]        && faltan="$faltan SSH_HOST"
          [ -z "${{ secrets.SSH_USER }}" ]        && faltan="$faltan SSH_USER"
          [ -z "${{ secrets.SSH_PORT }}" ]        && faltan="$faltan SSH_PORT"
          if [ -n "$faltan" ]; then
            echo "Faltan estos secretos:$faltan"
            echo "Se crean en Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "Los cuatro secretos estan definidos."

      - name: Preparar la clave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<CFG
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Publicar por rsync
        # -rlvz y no -a: -a arrastra permisos y propietario, que en hosting
        # compartido fallan porque el uid remoto no es nuestro.
        #
        # SIN --delete a proposito. public_html es compartido: ahi viven api/ y
        # otras aplicaciones, y un borrado mal acotado se las llevaria por
        # delante. El coste es que los bundles viejos con hash se acumulan;
        # como Angular versiona los nombres, no estorban (solo ocupan disco) y
        # se pueden limpiar a mano de vez en cuando.
        run: rsync -rlvz ./dist/techsolutions-frontend/browser/ "deploy:$DEPLOY_PATH/"

      - name: Comprobar que el sitio responde
        run: |
          curl -fsS -o /dev/null -w "healthcheck / -> %{http_code}\n" "$SITE_URL"
          # El service worker y el manifest deben servirse desde la raiz: si
          # alguno da 404, las notificaciones no llegan y la PWA no se instala.
          curl -fsS -o /dev/null -w "firebase-messaging-sw.js -> %{http_code}\n" "$SITE_URL/firebase-messaging-sw.js"
          curl -fsS -o /dev/null -w "manifest.webmanifest -> %{http_code}\n" "$SITE_URL/manifest.webmanifest"
